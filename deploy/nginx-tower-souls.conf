# /etc/nginx/conf.d/tower-souls.conf
# 先替换 tower.example.com 和证书路径；首次可用 certbot 自动生成 443 配置。
server {
    listen 80;
    server_name tower.example.com;

    # certbot --nginx -d tower.example.com 会在这里生成跳转与 443 配置。
    # 如果只想先用 HTTP 测试，可暂时保留这一段。

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 必须关闭缓冲，否则状态会成块延迟到达。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    gzip on;
    gzip_min_length 1024;
    # 不要压缩 text/event-stream；这里不列它即可。
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
